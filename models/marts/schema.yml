version: 2

models:
  - name: mart_revenue
    description: Power BI revenue dataset with one row per sales month and category.
    columns:
      - name: mart_revenue_id
        data_tests:
          - not_null
          - unique
      - name: SalesMonth
        data_tests:
          - not_null
      - name: CategoryName
        data_tests:
          - not_null
      - name: category_revenue
        data_tests:
          - not_null
      - name: is_partial_month
        data_tests:
          - not_null

  - name: mart_product
    description: Power BI product dataset with one row per product that has sales.
    columns:
      - name: ProductID
        data_tests:
          - not_null
          - unique
      - name: total_revenue
        data_tests:
          - not_null

  - name: mart_customer
    description: Power BI customer dataset with one row per customer that has dated sales.
    columns:
      - name: CustomerID
        data_tests:
          - not_null
          - unique
      - name: customer_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Repeat Customers', 'One-time Buyers']
      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'VIP Customers'
                  - 'Premium Occasional Customers'
                  - 'Loyal Low-Value Customers'
                  - 'Regular Customers'

  - name: mart_salesperson
    description: Power BI salesperson dataset with one row per sales month and salesperson.
    columns:
      - name: mart_salesperson_id
        data_tests:
          - not_null
          - unique
      - name: SalesMonth
        data_tests:
          - not_null
      - name: SalesPersonID
        data_tests:
          - not_null
      - name: avg_revenue_per_transaction
        data_tests:
          - not_null

  - name: mart_geography
    description: Power BI geography dataset with one row per city that has dated sales.
    columns:
      - name: CityID
        data_tests:
          - not_null
          - unique
      - name: USRegion
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['West', 'Midwest', 'South', 'Northeast', 'Other / Unknown']
      - name: total_revenue
        data_tests:
          - not_null
